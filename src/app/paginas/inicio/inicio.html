<div class="tarjeta-bienvenida">
  <h1>✨ Tu Plantilla Angular está Lista</h1>
  <p class="subtitulo">Comienza a construir aplicaciones asombrosas a partir de esta base limpia.</p>
  
  <div class="seccion-demo">
    <h3>🧪 Zona de Pruebas de Signals y Servicios</h3>
    
    <div class="demostracion-signals">
      <p>Has hecho clic al botón interactivo <strong>{{ contadorClicks() }}</strong> veces.</p>
      <button class="btn-primario" (click)="incrementar()">
        Incrementar ➕
      </button>
    </div>

    <div class="demostracion-alertas">
      <button class="btn-primario btn-exito" (click)="probarExito()">Probar Éxito 🎯</button>
      <button class="btn-primario btn-error" (click)="probarError()">Probar Error ❌</button>
    </div>
  </div>
</div>
